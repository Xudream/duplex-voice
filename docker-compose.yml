services:
  server:
    build: .
    container_name: duplex-voice-server
    restart: unless-stopped
    ports:
      # 局域网模式：8787:8787（直连）；公网模式（详见 docs/公网部署指南.md）：
      # 仅绑本机由 Caddy 反代 -> 127.0.0.1:8787:8787
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config.yaml:/app/config.yaml          # API key 挂载注入（不入镜像）
      - tts-cache:/app/web/tts_cache            # TTS 合成缓存
      - devices:/app/web/devices.json           # 设备注册库（bind file 用 volumes 项示意）
    environment:
      - TTS_STREAM=1

volumes:
  tts-cache:
