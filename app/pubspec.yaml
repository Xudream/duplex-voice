name: duplex_voice_app
description: duplex-voice App client (Android/iOS) - connects to Linux server
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.2.0-beta.2    # P1: 嵌现有 web 页面（VAD/打断/时延面板零改动复用）
  shared_preferences: ^2.2.3       # P1: 服务端地址持久化
  # P2（原生音频直连 /api/stream）再启用:
  # web_socket_channel: ^3.0.1
  # record: ^6.x
  # just_audio: ^0.9.40

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
